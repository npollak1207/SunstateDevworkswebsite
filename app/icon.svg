<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sun" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#FFE1B0"/>
      <stop offset="42%" stop-color="#FF9A4E"/>
      <stop offset="78%" stop-color="#F04E23"/>
      <stop offset="100%" stop-color="#C2371A"/>
    </radialGradient>
    <clipPath id="above"><rect x="0" y="0" width="64" height="42.5"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#14110B"/>
  <!-- rays radiating from the sun's center (32,40) -->
  <g stroke="#FF7A3D" stroke-width="2.6" stroke-linecap="round">
    <line x1="32" y1="22" x2="32" y2="14"/>
    <line x1="19.3" y1="27.3" x2="14.0" y2="22.0"/>
    <line x1="44.7" y1="27.3" x2="50.0" y2="22.0"/>
    <line x1="14" y1="40" x2="7" y2="40"/>
    <line x1="50" y1="40" x2="57" y2="40"/>
  </g>
  <!-- rising disc, clipped at the horizon -->
  <circle cx="32" cy="40" r="14.5" fill="url(#sun)" clip-path="url(#above)"/>
  <!-- horizon line -->
  <line x1="8" y1="42.5" x2="56" y2="42.5" stroke="#F04E23" stroke-width="2.6" stroke-linecap="round"/>
</svg>
